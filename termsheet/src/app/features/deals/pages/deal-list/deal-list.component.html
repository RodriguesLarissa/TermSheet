<mat-toolbar>
  <img src="assets/logo.png" alt="TermSheet" class="logo" />

  <span class="spacer"></span>

  <button mat-button (click)="logout()">Logout</button>
</mat-toolbar>

<div class="page">
  <mat-card>
    <div class="header">
      <h2>Deals</h2>
    </div>

    @if (isLoading) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <table mat-table [dataSource]="(deals$ | async) ?? []">
        <ng-container matColumnDef="dealName">
          <th mat-header-cell *matHeaderCellDef>Deal Name</th>

          <td mat-cell *matCellDef="let deal">
            {{ deal.dealName }}
          </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>

          <td mat-cell *matCellDef="let deal">
            {{ deal.address }}
          </td>
        </ng-container>

        <ng-container matColumnDef="purchasePrice">
          <th mat-header-cell *matHeaderCellDef>Purchase Price</th>

          <td mat-cell *matCellDef="let deal">
            {{ deal.purchasePrice | currency }}
          </td>
        </ng-container>

        <ng-container matColumnDef="noi">
          <th mat-header-cell *matHeaderCellDef>NOI</th>

          <td mat-cell *matCellDef="let deal">
            {{ deal.noi | currency }}
          </td>
        </ng-container>

        <ng-container matColumnDef="capRate">
          <th mat-header-cell *matHeaderCellDef>Cap Rate</th>

          <td mat-cell *matCellDef="let deal">
            <span [class]="getCapRateClass(deal.capRate)">
              {{ deal.capRate / 100 | percent: "1.1-1" }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  </mat-card>
</div>
